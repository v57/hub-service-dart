name: hub_service
description: >-
  Dart port of hub-service — connect to a hub, host post/stream API endpoints,
  register apps, and call API through the hub. Auth: ed25519 keychain auth
  file (hub-server), TS parity.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  channel_dart:
    path: ../../Channel/channel-dart
  cryptography: ^2.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
