name: hub_service
description: >-
  Dart port of hub-service — connect to a hub, host post/stream API endpoints,
  register apps, and call API through the hub. Lite port: no auth, no keychain,
  no crypto.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  channel_dart:
    path: ../channel-dart

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
