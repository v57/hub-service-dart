name: hub_service
description: >-
  Dart port of hub-service — connect to a hub, host post/stream API endpoints,
  register apps, and call API through the hub. Auth: ed25519 keychain auth
  file (hub-server), TS parity.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  # scripts/test overrides this with ../../Channel/channel-dart when that checkout is there.
  channel_dart:
    git:
      url: https://github.com/v57/channel-dart
      ref: a6e9f95675c197d6a06a799c1bf3001f9168d2e0
  cryptography: ^2.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
